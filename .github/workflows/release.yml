name: Build and publish Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Build signed APK
        run: bash gradlew :app:assembleRelease

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/release/*.apk "DailyTask-${GITHUB_REF_NAME}.apk"
          sha256sum "DailyTask-${GITHUB_REF_NAME}.apk" > "DailyTask-${GITHUB_REF_NAME}.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            DailyTask-${{ github.ref_name }}.apk
            DailyTask-${{ github.ref_name }}.sha256
